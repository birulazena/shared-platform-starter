spring:
  application:
    name: platform-mvc-adoption
  main:
    web-application-type: servlet

management:
  otlp:
    metrics:
      export:
        enabled: false

logistics:
  parent-service:
    security:
      issuer: https://identity.example.test/realms/logistics
    tracing:
      sampling-probability: 1.0
    metrics:
      common-tags:
        environment: adoption-test
    errors:
      detail-policy: GENERIC
    logging:
      redaction-mask: "[REDACTED]"
